{% extends "base.html" %}
{% block title %}Log in - LexiValidate{% endblock %}
{% block content %}
<div class="narrow">
  <h1>LexiValidate</h1>
  <p class="muted">Sign in to validate or manage lexicon entries.</p>
  <form method="post">
    <label>Username
      <input type="text" name="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button type="submit">Log in</button>
  </form>
</div>
{% endblock %}
